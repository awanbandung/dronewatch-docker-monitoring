global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["monitoring-prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          nodename: dronewatch-prod

  - job_name: "cadvisor"
    static_configs:
      - targets: ["monitoring-cadvisor:8080"]

    metric_relabel_configs:
      - source_labels: ["container_label_com_docker_swarm_service_name"]
        target_label: "service"

      - source_labels: ["name"]
        target_label: "container"

      - source_labels: ["container"]
        regex: ".*monitoring-.*"
        action: drop

  # =========================
  # BLACKBOX (FILE SD CLEAN)
  # =========================
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]

    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-http.json
        refresh_interval: 30s

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - source_labels: [service]
        target_label: service

      - target_label: __address__
        replacement: monitoring-blackbox-exporter:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - monitoring-alertmanager:9093

rule_files:
  - /etc/prometheus/rules.yml
